<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Temporizador Completo</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 30px; }
    input { font-size: 20px; padding: 5px; }
    button {
      font-size: 20px;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      border-radius: 8px;
    }
    #main-time { font-size: 60px; margin-top: 20px; }
    #initial, #extra, #total { font-size: 22px; margin-top: 10px; }

    #xp-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #ffd54f;
      padding: 25px 40px;
      border-radius: 15px;
      font-size: 26px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

<h2>Cane´s Temporizador Game</h2>

<input id="minutes" type="number" placeholder="Minutos" min="0">

<div>
  <button id="start-btn">Iniciar</button>
  <button id="stop-btn">Parar</button>
  <button id="reset-btn">Reiniciar</button>
  <button id="done-btn">Hecho</button>
</div>

<div id="main-time">00:00</div>
<div id="initial">Tiempo inicial: --:--</div>
<div id="extra">Tiempo extra: +00:00</div>
<div id="total">Tiempo total: 00:00</div>

<div id="xp-popup"></div>

<script>
let interval = null;
let startTimestamp = null;
let endTimestamp = null;
let pausedRemaining = null;
let totalInitial = 0;
let totalAccumulatedSeconds = 0;
let played = false;

const mainTimeEl = document.getElementById("main-time");
const initialEl = document.getElementById("initial");
const extraEl = document.getElementById("extra");
const totalEl = document.getElementById("total");
const xpPopup = document.getElementById("xp-popup");

document.getElementById("start-btn").onclick = startTimer;
document.getElementById("stop-btn").onclick = stopTimer;
document.getElementById("reset-btn").onclick = resetTimer;
document.getElementById("done-btn").onclick = finishTask;

function formatTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = String(Math.floor(sec / 60)).padStart(2, "0");
  const s = String(sec % 60).padStart(2, "0");
  return `${m}:${s}`;
}

function startTimer() {
  if (pausedRemaining !== null) {
    startTimestamp = Date.now() - (totalInitial - pausedRemaining) * 1000;
    endTimestamp = Date.now() + pausedRemaining * 1000;
    pausedRemaining = null;
  } else {
    const minutes = Number(document.getElementById("minutes").value) || 0;
    totalInitial = minutes * 60;
    startTimestamp = Date.now();
    endTimestamp = startTimestamp + totalInitial * 1000;
    initialEl.textContent = "Tiempo inicial: " + formatTime(totalInitial);
    extraEl.textContent = "Tiempo extra: +00:00";
  }

  clearInterval(interval);
  interval = setInterval(updateTimer, 200);
}

function updateTimer() {
  const diff = Math.floor((endTimestamp - Date.now()) / 1000);

  if (diff < 0) {
    const extra = Math.abs(diff);
    mainTimeEl.textContent = "+" + formatTime(extra);
    extraEl.textContent = "Tiempo extra: +" + formatTime(extra);
  } else {
    mainTimeEl.textContent = formatTime(diff);
  }
}

function stopTimer() {
  clearInterval(interval);
  pausedRemaining = Math.floor((endTimestamp - Date.now()) / 1000);
}

function finishTask() {
  clearInterval(interval);
  if (!startTimestamp) return;

  const elapsedSeconds =
    Math.floor((Date.now() - startTimestamp) / 1000);

  const baseSeconds = Math.min(elapsedSeconds, totalInitial);
  const extraSeconds = Math.max(0, elapsedSeconds - totalInitial);

  const sessionSeconds = baseSeconds + extraSeconds;
  totalAccumulatedSeconds += sessionSeconds;

  totalEl.textContent =
    "Tiempo total: " + formatTime(totalAccumulatedSeconds);

  xpPopup.textContent =
    "Tiempo sumado: " + formatTime(sessionSeconds);
  xpPopup.style.display = "block";

  setTimeout(() => xpPopup.style.display = "none", 2500);

  // reset sesión
  mainTimeEl.textContent = "00:00";
  initialEl.textContent = "Tiempo inicial: --:--";
  extraEl.textContent = "Tiempo extra: +00:00";

  startTimestamp = null;
  pausedRemaining = null;
  totalInitial = 0;
}

function resetTimer() {
  clearInterval(interval);

  startTimestamp = null;
  pausedRemaining = null;
  totalInitial = 0;
  totalAccumulatedSeconds = 0;

  mainTimeEl.textContent = "00:00";
  initialEl.textContent = "Tiempo inicial: --:--";
  extraEl.textContent = "Tiempo extra: +00:00";
  totalEl.textContent = "Tiempo total: 00:00";
}
</script>

</body>
</html>
